<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>루틴바인더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Gowun+Batang:wght@700&display=swap">
<style>
/* Layout: 바인더 한 권 — 상단 날짜 헤더, 종이 페이지, 하단 인덱스 탭 */
:root{
  --paper:#f6f7f4; --sheet:#ffffff; --ink:#1d2a3a; --muted:#6b7684; --line:#dfe3e6;
  --accent:#2f5d8a; --accent-soft:#e3ecf5;
  --go:#2e9e5b; --wait:#e0a526; --stop:#d2483d; --rest:#8a94a0;
  --c1:#2f5d8a; --c2:#7b5ea7; --c3:#d07a2c; --c4:#2e9e5b; --c5:#8a94a0;
  --display:"Gowun Batang",serif;
  --body:"IBM Plex Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171d; --sheet:#1a2129; --ink:#e6ebf0; --muted:#97a2ae; --line:#2b3540;
  --accent:#7fb0e0; --accent-soft:#22313f; --go:#4cc27e; --wait:#f0bd48; --stop:#ee6a5f; --rest:#7d8894;
  --c1:#7fb0e0; --c2:#b69be0; --c3:#eba566; --c4:#4cc27e; --c5:#7d8894; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171d; --sheet:#1a2129; --ink:#e6ebf0; --muted:#97a2ae; --line:#2b3540;
  --accent:#7fb0e0; --accent-soft:#22313f; --go:#4cc27e; --wait:#f0bd48; --stop:#ee6a5f; --rest:#7d8894;
  --c1:#7fb0e0; --c2:#b69be0; --c3:#eba566; --c4:#4cc27e; --c5:#7d8894; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.datebox h1{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance}
.datebox small{color:var(--muted);font-size:12px;letter-spacing:.04em}
.navbtn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.stack{display:flex;flex-direction:column;gap:14px}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.label button{font-size:12px;letter-spacing:0;text-transform:none}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost{background:none;border:none;color:var(--accent);cursor:pointer;font-weight:500;padding:4px}
.demo{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}

/* 신호등 */
.light{display:flex;align-items:center;gap:14px}
.lamps{display:flex;gap:6px;background:var(--ink);padding:7px 9px;border-radius:20px}
.lamp{width:16px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--sheet) 25%,transparent);transition:background .3s}
.lamp.on.r{background:var(--stop);box-shadow:0 0 10px var(--stop)}
.lamp.on.y{background:var(--wait);box-shadow:0 0 10px var(--wait)}
.lamp.on.g{background:var(--go);box-shadow:0 0 10px var(--go)}
.light .msg b{font-size:17px}
.light .msg div{color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);transition:width .3s}

/* 루틴 */
.rlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.rt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--sheet);color:var(--ink);cursor:pointer;text-align:left;min-width:0}
.rt .e{font-size:20px;flex:none}
.rt span{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt.done{background:color-mix(in srgb,var(--go) 14%,var(--sheet));border-color:var(--go)}
.rt.done span{text-decoration:line-through;color:var(--muted)}
.restbtn{margin-top:10px;width:100%;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:10px;padding:8px;cursor:pointer}
.restbtn.on{border-style:solid;border-color:var(--rest);color:var(--ink);background:color-mix(in srgb,var(--rest) 15%,var(--sheet))}

/* 우선순위 */
.todo{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:none}
.pri{font-family:var(--mono);font-size:12px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;border:1.5px solid currentColor;background:none;cursor:pointer}
.pri.A{color:var(--stop)}.pri.B{color:var(--wait)}.pri.C{color:var(--muted)}
.todo .t{flex:1;min-width:0;cursor:pointer}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:none;cursor:pointer;flex:none;color:var(--sheet);font-size:12px}
.todo.done .chk{background:var(--go);border-color:var(--go)}
.del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 2px}
.add{display:flex;gap:6px;margin-top:10px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit}
.add button{border:none;background:var(--accent);color:var(--sheet);border-radius:9px;padding:0 14px;font-weight:700;cursor:pointer}

/* 시간 기록 */
.grid-wrap{overflow-x:auto}
.tgrid{display:grid;grid-template-columns:46px 1fr 1fr;border-top:1px solid var(--line);min-width:300px}
.tgrid .h{font-size:11px;color:var(--muted);font-weight:700;padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.tm{font-family:var(--mono);font-size:11px;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.tm.half{color:transparent}
.cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:5px 6px;font-size:12px;cursor:pointer;min-height:30px;background:none;color:var(--ink);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.cell.now{box-shadow:inset 3px 0 0 var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.share{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px;background:var(--line)}
.sumtxt{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* 주간 */
.wk{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(7,minmax(0,1fr));gap:4px;align-items:center;font-size:12px}
.wk .dh{text-align:center;color:var(--muted);font-weight:700}
.wk .dh.today{color:var(--accent)}
.wk .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:20px;height:20px;border-radius:50%;margin:0 auto;border:1.5px solid var(--line);background:none;padding:0;cursor:pointer}
.dot.y{background:var(--go);border-color:var(--go)}
.dot.rest{background:var(--rest);border-color:var(--rest);opacity:.5}
.sig{width:12px;height:12px;border-radius:50%;margin:0 auto}

/* 목표 */
textarea{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px;font:inherit;resize:vertical;min-height:80px}
.mission{font-family:var(--display);font-size:17px;line-height:1.6}
.goal{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:none}
.role{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;flex:none}
.goal .t{flex:1;min-width:0}

/* 통계 */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{text-align:center;padding:12px 4px;border:1px solid var(--line);border-radius:12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.kpi small{color:var(--muted);font-size:12px}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);padding-top:8px}
.chart div{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.rstat{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.rstat .n{flex:0 0 40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rstat .b{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.rstat .b i{display:block;height:100%;background:var(--accent)}
.rstat .p{font-family:var(--mono);font-size:12px;width:38px;text-align:right}

/* 탭 */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:none;color:var(--muted);padding:10px 0 12px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:700}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--sheet);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal h3{margin:0 0 12px;font-size:16px}
.modal input{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip.on{border-color:currentColor;font-weight:700}
.row{display:flex;gap:8px;justify-content:flex-end}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.pri1{background:var(--accent);color:var(--sheet)}
.btn.sec{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.emojis button{font-size:20px;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:none;cursor:pointer}
.emojis button.on{border-color:var(--accent);background:var(--accent-soft)}
.hint{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<div class="wrap">
  <header>
    <button class="navbtn" id="prev" aria-label="이전 날">‹</button>
    <div class="datebox" style="text-align:center"><h1 id="dTitle"></h1><small id="dSub"></small></div>
    <button class="navbtn" id="next" aria-label="다음 날">›</button>
  </header>
  <div class="demo" id="demo" hidden><span>예시 데이터가 들어 있어요. 직접 쓰려면 비우고 시작하세요.</span><button class="ghost" id="clearDemo">비우기</button></div>
  <main id="view" class="stack"></main>
</div>

<nav><div class="in">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>오늘</button>
  <button data-tab="time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>시간</button>
  <button data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>주간</button>
  <button data-tab="goal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>목표</button>
  <button data-tab="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>통계</button>
</div></nav>
<div id="modalRoot"></div>

<script>
const KEY='routine-binder-v1';
const CATS=[{id:'c1',n:'업무'},{id:'c2',n:'자기계발'},{id:'c3',n:'가족'},{id:'c4',n:'건강'},{id:'c5',n:'휴식·기타'}];
const EMO=['💧','📖','🏃','🧘','📝','💊','🛏️','🥗','🙏','🧹','📵','☀️','🎯','💪','🎸','📚'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const TODAY=ymd(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const weekStart=s=>{const d=new Date(s+'T00:00');const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)};

function seed(){
  const r=[{id:'r1',e:'💧',n:'공복에 물 한 잔'},{id:'r2',e:'🧘',n:'아침 스트레칭'},{id:'r3',e:'📖',n:'독서 20분'},{id:'r4',e:'📵',n:'밤 11시 폰 끄기'},{id:'r5',e:'📝',n:'하루 회고 쓰기'}];
  const log={};
  for(let i=1;i<=20;i++){const d=addD(TODAY,-i);const k=(i*7)%10;
    if(k===3){log[d]={done:[],rest:true};continue}
    log[d]={done:r.filter((x,j)=>((i+j*3)%5)<(k>6?4:3)).map(x=>x.id),rest:false}}
  log[TODAY]={done:['r1'],rest:false};
  const plan={},doo={};
  plan[TODAY]={'07:00':{t:'스트레칭·물',c:'c4'},'09:00':{t:'오전 업무',c:'c1'},'09:30':{t:'오전 업무',c:'c1'},'12:30':{t:'독서',c:'c2'},'19:00':{t:'가족 저녁',c:'c3'},'21:30':{t:'하루 회고',c:'c2'}};
  doo[TODAY]={'07:00':{t:'스트레칭',c:'c4'},'09:00':{t:'메일 정리',c:'c1'},'09:30':{t:'회의',c:'c1'}};
  return {demo:true,
    mission:'가족과 지역에 보탬이 되는 일을 꾸준히, 건강하게 해 나간다.',
    goals:[{id:uid(),role:'나',t:'매일 독서 20분, 올해 24권'},{id:uid(),role:'가족',t:'주말 하루는 가족 나들이'},{id:uid(),role:'일',t:'사업계획서 완성'}],
    routines:r,log,
    todos:{[TODAY]:[{id:uid(),p:'A',t:'사업계획서 초안 마무리',d:false},{id:uid(),p:'B',t:'장보기 목록 정리',d:true},{id:uid(),p:'C',t:'사진 백업',d:false}]},
    plan,doo,
    weekGoals:{[weekStart(TODAY)]:[{id:uid(),t:'운동 3회',d:false},{id:uid(),t:'책 1권 완독',d:false}]}};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let cur=TODAY,tab='today';

function dayInfo(d){
  const l=S.log[d]||{done:[],rest:false};
  const tot=S.routines.length, n=l.done.filter(id=>S.routines.some(r=>r.id===id)).length;
  const pct=tot?Math.round(n/tot*100):0;
  let sig='none';
  if(l.rest)sig='rest';else if(pct>=60)sig='g';else if(pct>0)sig='y';else if(d<TODAY)sig='r';
  return {l,tot,n,pct,sig};
}
const sigColor={g:'var(--go)',y:'var(--wait)',r:'var(--stop)',rest:'var(--rest)',none:'var(--line)'};

function header(){
  const d=new Date(cur+'T00:00');const wd='일월화수목금토'[d.getDay()];
  document.getElementById('dTitle').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${wd}요일`;
  const diff=Math.round((d-new Date(TODAY+'T00:00'))/864e5);
  document.getElementById('dSub').textContent=diff===0?'오늘':diff===-1?'어제':diff===1?'내일':(diff<0?`${-diff}일 전`:`${diff}일 뒤`);
  document.getElementById('demo').hidden=!S.demo;
}

function vToday(){
  const {l,tot,n,pct,sig}=dayInfo(cur);
  const msg={g:['초록불이에요','완벽하지 않아도 잘하고 있어요'],y:['노란불이에요','하나만 더 하면 초록불에 가까워져요'],r:['빨간불이었어요','괜찮아요, 오늘 다시 시작해요'],rest:['쉬는 날','쉬는 것도 루틴이에요. 기록이 끊기지 않아요'],none:['아직 시작 전','첫 루틴 하나부터 체크해 보세요']}[sig];
  const todos=(S.todos[cur]||[]).slice().sort((a,b)=>a.p.localeCompare(b.p));
  return `
  <section class="sheet">
    <div class="label">루틴 신호등 <button class="ghost" data-act="editR">루틴 편집</button></div>
    <div class="light">
      <div class="lamps" aria-hidden="true"><i class="lamp r ${sig==='r'?'on':''}"></i><i class="lamp y ${sig==='y'?'on':''}"></i><i class="lamp g ${sig==='g'?'on':''}"></i></div>
      <div class="msg"><b>${msg[0]}</b><div>${msg[1]} · ${n}/${tot} 완료 (${pct}%)</div></div>
    </div>
    <div class="bar"><i style="width:${l.rest?0:pct}%"></i></div>
    <div class="rlist">${S.routines.map(r=>`<button class="rt ${l.done.includes(r.id)?'done':''}" data-act="tgR" data-id="${r.id}"><span class="e">${l.done.includes(r.id)?'✅':r.e}</span><span>${esc(r.n)}</span></button>`).join('')}</div>
    <button class="restbtn ${l.rest?'on':''}" data-act="rest">${l.rest?'🌙 오늘은 쉬는 날 (해제하려면 누르기)':'🌙 오늘은 쉴래요 (빨간불 대신 쉼으로 기록)'}</button>
  </section>
  <section class="sheet">
    <div class="label">오늘의 우선순위 <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">A 꼭 · B 해야 · C 하면 좋음</span></div>
    ${todos.length?todos.map(t=>`<div class="todo ${t.d?'done':''}"><button class="pri ${t.p}" data-act="cyP" data-id="${t.id}" aria-label="우선순위 바꾸기">${t.p}</button><span class="t" data-act="tgT" data-id="${t.id}">${esc(t.t)}</span><button class="chk" data-act="tgT" data-id="${t.id}" aria-label="완료">✓</button><button class="del" data-act="delT" data-id="${t.id}" aria-label="삭제">×</button></div>`).join(''):'<div class="hint">오늘 꼭 할 일을 A부터 적어 보세요.</div>'}
    <form class="add" data-form="todo"><input id="todoIn" placeholder="할 일 추가" autocomplete="off"><button>추가</button></form>
  </section>
  <section class="sheet">
    <div class="label">한 줄 회고</div>
    <textarea id="memo" placeholder="오늘 잘한 점, 아쉬운 점, 내일 바꿀 한 가지">${esc((S.memo||{})[cur]||'')}</textarea>
  </section>`;
}

function slots(){const a=[];for(let h=5;h<24;h++){a.push(pad(h)+':00');a.push(pad(h)+':30')}return a}
function vTime(){
  const p=S.plan[cur]||{},d=S.doo[cur]||{};
  const now=new Date();const ns=cur===TODAY?pad(now.getHours())+':'+(now.getMinutes()<30?'00':'30'):'';
  const sum={};Object.values(d).forEach(x=>{sum[x.c]=(sum[x.c]||0)+30});
  const tot=Object.values(sum).reduce((a,b)=>a+b,0);
  const cell=(o,k,col)=>{const v=o[k];const st=v?`style="background:color-mix(in srgb,var(--${v.c}) 18%,transparent);box-shadow:inset 3px 0 0 var(--${v.c})"`:'';return `<button class="cell" data-act="slot" data-col="${col}" data-k="${k}" ${st}>${v?esc(v.t):''}</button>`};
  return `
  <section class="sheet">
    <div class="label">실행 시간 분석</div>
    <div class="share">${CATS.map(c=>sum[c.id]?`<i style="width:${sum[c.id]/tot*100}%;background:var(--${c.id})"></i>`:'').join('')}</div>
    <div class="sumtxt">${tot?CATS.filter(c=>sum[c.id]).map(c=>`${c.n} ${(sum[c.id]/60).toFixed(1)}h`).join(' · '):'실행 칸을 채우면 시간 사용이 분석돼요'}</div>
    <div class="legend">${CATS.map(c=>`<span><i style="background:var(--${c.id})"></i>${c.n}</span>`).join('')}</div>
  </section>
  <section class="sheet" style="padding:8px 8px 0">
    <div class="grid-wrap"><div class="tgrid">
      <div class="h">시각</div><div class="h">계획 (Plan)</div><div class="h">실행 (Do)</div>
      ${slots().map(k=>`<div class="tm ${k.endsWith('30')?'half':''}">${k.endsWith('30')?'·':k}</div>${cell(p,k,'plan').replace('class="cell"',k===ns?'class="cell now"':'class="cell"')}${cell(d,k,'doo')}`).join('')}
    </div></div>
  </section>`;
}

function vWeek(){
  const ws=weekStart(cur);const days=[...Array(7)].map((_,i)=>addD(ws,i));
  const wg=S.weekGoals[ws]||[];
  const avg=Math.round(days.filter(d=>d<=TODAY).map(d=>dayInfo(d)).filter(x=>!x.l.rest).reduce((a,x,_,arr)=>a+x.pct/arr.length,0)||0);
  return `
  <section class="sheet">
    <div class="label">이번 주 목표 <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">${ws.slice(5).replace('-','/')} ~ ${addD(ws,6).slice(5).replace('-','/')}</span></div>
    ${wg.length?wg.map(t=>`<div class="todo ${t.d?'done':''}"><span class="t" data-act="tgW" data-id="${t.id}">${esc(t.t)}</span><button class="chk" data-act="tgW" data-id="${t.id}" aria-label="완료">✓</button><button class="del" data-act="delW" data-id="${t.id}" aria-label="삭제">×</button></div>`).join(''):'<div class="hint">이번 주에 이룰 2~3가지를 적어 보세요.</div>'}
    <form class="add" data-form="week"><input id="weekIn" placeholder="주간 목표 추가" autocomplete="off"><button>추가</button></form>
  </section>
  <section class="sheet">
    <div class="label">루틴 체크표 <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">평균 달성 ${avg}%</span></div>
    <div class="wk">
      <div></div>${days.map(d=>`<div class="dh ${d===TODAY?'today':''}">${'월화수목금토일'[(new Date(d+'T00:00').getDay()+6)%7]}</div>`).join('')}
      <div class="hint">신호등</div>${days.map(d=>`<div class="sig" style="background:${sigColor[dayInfo(d).sig]}"></div>`).join('')}
      ${S.routines.map(r=>`<div class="rn">${r.e} ${esc(r.n)}</div>${days.map(d=>{const l=S.log[d];const c=l&&l.rest?'rest':(l&&l.done.includes(r.id)?'y':'');return `<button class="dot ${c}" style="background-clip:padding-box" data-act="wkR" data-d="${d}" data-id="${r.id}" aria-label="${d} ${esc(r.n)}"></button>`}).join('')}`).join('')}
    </div>
  </section>`;
}

function vGoal(){
  return `
  <section class="sheet">
    <div class="label">사명 (Mission) <button class="ghost" data-act="editM">수정</button></div>
    <div class="mission">${S.mission?esc(S.mission):'<span class="hint">내 삶의 방향을 한 문장으로 적어 보세요.</span>'}</div>
  </section>
  <section class="sheet">
    <div class="label">역할별 목표</div>
    ${S.goals.length?S.goals.map(g=>`<div class="goal"><span class="role">${esc(g.role)}</span><span class="t">${esc(g.t)}</span><button class="del" data-act="delG" data-id="${g.id}" aria-label="삭제">×</button></div>`).join(''):'<div class="hint">아빠, 직장인, 나 자신처럼 역할마다 목표를 하나씩 세워 보세요.</div>'}
    <form class="add" data-form="goal"><input id="roleIn" placeholder="역할" style="flex:0 0 76px" autocomplete="off"><input id="goalIn" placeholder="목표" autocomplete="off"><button>추가</button></form>
  </section>
  <section class="sheet">
    <div class="label">백업 · 복원</div>
    <div class="hint">기록은 이 휴대폰 안에만 저장돼요. 가끔 백업을 카톡·메모로 보내 두세요.</div>
    <div class="row" style="justify-content:flex-start;margin:10px 0"><button class="btn pri1" data-act="backup">백업 보내기</button></div>
    <textarea id="restoreIn" placeholder="백업해 둔 내용을 여기에 붙여넣고 복원을 누르세요"></textarea>
    <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn sec" data-act="restore">복원하기</button><span class="hint" id="bkMsg" style="align-self:center"></span></div>
  </section>
  <section class="sheet"><div class="hint">3P바인더 흐름: 사명 → 역할별 목표 → 주간 목표 → 오늘의 우선순위 → 30분 단위 계획·실행. 위에서 아래로 내려오며 연결해 보세요.</div></section>`;
}

function vStat(){
  const days=[...Array(30)].map((_,i)=>addD(TODAY,i-29));
  const info=days.map(dayInfo);
  let streak=0;for(let i=29;i>=0;i--){const s=info[i].sig;if(s==='g'||s==='y'||s==='rest')streak++;else if(i===29&&s==='none')continue;else break}
  const active=info.filter(x=>!x.l.rest&&x.sig!=='none');
  const avg=active.length?Math.round(active.reduce((a,x)=>a+x.pct,0)/active.length):0;
  const greens=info.filter(x=>x.sig==='g').length;
  const per=S.routines.map(r=>{const ds=days.filter(d=>S.log[d]&&!S.log[d].rest&&d<=TODAY);const c=ds.filter(d=>S.log[d].done.includes(r.id)).length;return {r,p:ds.length?Math.round(c/ds.length*100):0}});
  return `
  <section class="sheet">
    <div class="label">최근 30일</div>
    <div class="kpis"><div class="kpi"><b>${streak}</b><small>연속 기록일</small></div><div class="kpi"><b>${avg}%</b><small>평균 달성률</small></div><div class="kpi"><b>${greens}</b><small>초록불 날</small></div></div>
  </section>
  <section class="sheet">
    <div class="label">일별 달성률</div>
    <div class="chart">${info.map((x,i)=>`<div title="${days[i]} ${x.l.rest?'쉼':x.pct+'%'}" style="height:${x.l.rest?100:Math.max(x.pct,2)}%;background:${x.l.rest?'color-mix(in srgb,var(--rest) 35%,transparent)':sigColor[x.sig]}"></div>`).join('')}</div>
    <div class="axis"><span>${days[0].slice(5).replace('-','/')}</span><span>${days[15].slice(5).replace('-','/')}</span><span>오늘</span></div>
    <div class="legend"><span><i style="background:var(--go)"></i>60% 이상</span><span><i style="background:var(--wait)"></i>1~59%</span><span><i style="background:var(--stop)"></i>0%</span><span><i style="background:var(--rest)"></i>쉼</span></div>
  </section>
  <section class="sheet">
    <div class="label">루틴별 실천율</div>
    ${per.map(x=>`<div class="rstat"><span class="n">${x.r.e} ${esc(x.r.n)}</span><span class="b"><i style="width:${x.p}%"></i></span><span class="p">${x.p}%</span></div>`).join('')}
  </section>`;
}

function render(){
  header();
  document.getElementById('view').innerHTML={today:vToday,time:vTime,week:vWeek,goal:vGoal,stat:vStat}[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const m=document.getElementById('memo');
  if(m)m.addEventListener('input',()=>{S.memo=S.memo||{};S.memo[cur]=m.value;save()});
  if(tab==='time'&&cur===TODAY){const n=document.querySelector('.cell.now');if(n)n.scrollIntoView({block:'center'})}
}

function logOf(d){return S.log[d]||(S.log[d]={done:[],rest:false})}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function modal(html,onSave){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="scrim"><div class="modal" role="dialog">${html}</div></div>`;
  root.querySelector('.scrim').addEventListener('click',e=>{if(e.target.classList.contains('scrim'))closeModal()});
  root.querySelector('[data-m="cancel"]').onclick=closeModal;
  root.querySelector('[data-m="ok"]').onclick=()=>{onSave(root);closeModal();save();render()};
  const i=root.querySelector('input,textarea');if(i)i.focus();
}

function slotModal(col,k){
  const o=(S[col][cur]||{})[k];let c=o?o.c:'c1';
  const other=col==='doo'?(S.plan[cur]||{})[k]:null;
  modal(`<h3>${k} · ${col==='plan'?'계획':'실행'}</h3>
    <input id="slotIn" value="${o?esc(o.t):''}" placeholder="무엇을 ${col==='plan'?'할 건가요':'했나요'}?">
    <div class="chips">${CATS.map(x=>`<button class="chip ${x.id===c?'on':''}" data-c="${x.id}" style="color:var(--${x.id})">${x.n}</button>`).join('')}</div>
    ${other&&!o?`<button class="ghost" id="copyP">계획대로 했어요 ("${esc(other.t)}")</button>`:''}
    <div class="row" style="margin-top:10px">${o?'<button class="btn sec" id="clr">지우기</button>':''}<button class="btn sec" data-m="cancel">취소</button><button class="btn pri1" data-m="ok">저장</button></div>`,
  root=>{const t=root.querySelector('#slotIn').value.trim();S[col][cur]=S[col][cur]||{};if(t)S[col][cur][k]={t,c};else delete S[col][cur][k]});
  const root=document.getElementById('modalRoot');
  root.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{c=b.dataset.c;root.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))});
  const cp=root.querySelector('#copyP');if(cp)cp.onclick=()=>{root.querySelector('#slotIn').value=other.t;c=other.c;root.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.c===c))};
  const cl=root.querySelector('#clr');if(cl)cl.onclick=()=>{delete S[col][cur][k];save();closeModal();render()};
}

function routineModal(){
  let e='💧';
  modal(`<h3>루틴 편집</h3>
    ${S.routines.map(r=>`<div class="todo"><span>${r.e}</span><span class="t">${esc(r.n)}</span><button class="del" data-rid="${r.id}" aria-label="삭제">×</button></div>`).join('')}
    <div class="hint" style="margin-top:12px">새 루틴</div>
    <div class="emojis">${EMO.map(x=>`<button class="${x===e?'on':''}" data-e="${x}">${x}</button>`).join('')}</div>
    <input id="rIn" placeholder="예: 영양제 먹기">
    <div class="row" style="margin-top:12px"><button class="btn sec" data-m="cancel">닫기</button><button class="btn pri1" data-m="ok">추가하고 닫기</button></div>`,
  root=>{const n=root.querySelector('#rIn').value.trim();if(n)S.routines.push({id:uid(),e,n})});
  const root=document.getElementById('modalRoot');
  root.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{e=b.dataset.e;root.querySelectorAll('[data-e]').forEach(x=>x.classList.toggle('on',x===b))});
  root.querySelectorAll('[data-rid]').forEach(b=>b.onclick=()=>{S.routines=S.routines.filter(r=>r.id!==b.dataset.rid);save();b.parentElement.remove();render()});
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const id=t.dataset.id,a=t.dataset.act;const td=S.todos[cur]||[];
  if(a==='tgR'){const l=logOf(cur);l.rest=false;l.done=l.done.includes(id)?l.done.filter(x=>x!==id):[...l.done,id]}
  else if(a==='rest'){const l=logOf(cur);l.rest=!l.rest}
  else if(a==='tgT'){const x=td.find(x=>x.id===id);x.d=!x.d}
  else if(a==='cyP'){const x=td.find(x=>x.id===id);x.p={A:'B',B:'C',C:'A'}[x.p]}
  else if(a==='delT'){S.todos[cur]=td.filter(x=>x.id!==id)}
  else if(a==='tgW'||a==='delW'){const ws=weekStart(cur);const w=S.weekGoals[ws]||[];if(a==='tgW'){const x=w.find(x=>x.id===id);x.d=!x.d}else S.weekGoals[ws]=w.filter(x=>x.id!==id)}
  else if(a==='wkR'){const l=logOf(t.dataset.d);l.rest=false;l.done=l.done.includes(id)?l.done.filter(x=>x!==id):[...l.done,id]}
  else if(a==='delG'){S.goals=S.goals.filter(g=>g.id!==id)}
  else if(a==='backup'){const txt=JSON.stringify(S);if(window.AndroidBridge&&AndroidBridge.share)AndroidBridge.share(txt);else{const ta=document.getElementById('restoreIn');ta.value=txt;ta.select();document.getElementById('bkMsg').textContent='위 내용을 복사해 보관하세요'}return}
  else if(a==='restore'){const m=document.getElementById('bkMsg');try{const v=JSON.parse(document.getElementById('restoreIn').value);if(!v.routines||!v.log)throw 0;S=v;S.demo=false;save();render();document.getElementById('bkMsg').textContent='복원했어요'}catch(err){m.textContent='백업 내용이 아니에요. 전체를 그대로 붙여넣어 주세요'}return}
  else if(a==='slot'){slotModal(t.dataset.col,t.dataset.k);return}
  else if(a==='editR'){routineModal();return}
  else if(a==='editM'){modal(`<h3>나의 사명</h3><textarea id="mIn">${esc(S.mission||'')}</textarea><div class="row" style="margin-top:12px"><button class="btn sec" data-m="cancel">취소</button><button class="btn pri1" data-m="ok">저장</button></div>`,r=>{S.mission=r.querySelector('#mIn').value.trim()});return}
  save();render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.dataset.form;
  if(f==='todo'){const v=document.getElementById('todoIn').value.trim();if(!v)return;(S.todos[cur]=S.todos[cur]||[]).push({id:uid(),p:'A',t:v,d:false})}
  if(f==='week'){const v=document.getElementById('weekIn').value.trim();if(!v)return;const ws=weekStart(cur);(S.weekGoals[ws]=S.weekGoals[ws]||[]).push({id:uid(),t:v,d:false})}
  if(f==='goal'){const v=document.getElementById('goalIn').value.trim();const r=document.getElementById('roleIn').value.trim()||'나';if(!v)return;S.goals.push({id:uid(),role:r,t:v})}
  save();render();
  const again=document.querySelector(`[data-form="${f}"] input:last-of-type`);if(again)again.focus();
});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
document.getElementById('prev').onclick=()=>{cur=addD(cur,-1);render()};
document.getElementById('next').onclick=()=>{cur=addD(cur,1);render()};
document.getElementById('clearDemo').onclick=()=>{
  S={demo:false,mission:'',goals:[],routines:S.routines,log:{},todos:{},plan:{},doo:{},weekGoals:{},memo:{}};save();render()};
render();
</script>

</body></html>
